<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pra você 💗</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(circle at 50% 35%, #2a0a1f 0%, #0d0410 70%);
    color: #ffd6e8;
    font-family: Georgia, "Times New Roman", serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1rem; padding: 1.5rem; overflow: hidden; text-align: center;
  }
  canvas { width: min(78vw, 42vh); height: min(78vw, 42vh); cursor: pointer; position: relative; z-index: 2; }
  .texto { max-width: 22rem; min-height: 13rem; position: relative; z-index: 2; }
  h1 { font-size: 1.9rem; font-weight: normal; color: #ff8fc2; text-shadow: 0 0 14px #ff4d94; margin-bottom: .6rem; opacity: 0; transition: opacity 1.5s; }
  h1.show { opacity: 1; }
  p { font-size: 1.1rem; line-height: 1.6; margin-bottom: .5rem; min-height: 1.7rem; }
  p.final { color: #ff8fc2; font-style: italic; }
  .dica { font-size: .85rem; color: #ffb3d4; opacity: 0; transition: opacity 2s; }
  .dica.show { opacity: .8; }
  .float, .burst {
    position: fixed; color: #ff6fae; pointer-events: none; z-index: 3;
  }
  .float { bottom: -2rem; opacity: .7; animation: subir linear forwards; }
  @keyframes subir { to { transform: translateY(-110vh) rotate(25deg); opacity: 0; } }
  .burst { animation: explodir 1.2s ease-out forwards; }
  @keyframes explodir { to { transform: translate(var(--dx), var(--dy)) scale(.4); opacity: 0; } }
  .star {
    position: fixed; width: 2px; height: 2px; border-radius: 50%; background: #ffd6e8;
    animation: pisca 3s ease-in-out infinite; z-index: 1;
  }
  @keyframes pisca { 0%,100% { opacity: .1; } 50% { opacity: .9; } }
</style>
</head>
<body>

<canvas id="heartCanvas"></canvas>

<div class="texto">
  <h1 id="titulo">Pra vc, meu amor 💗</h1>
  <p id="l1"></p>
  <p id="l2"></p>
  <p id="l3" class="final"></p>
  <p id="l4" class="final"></p>
  <p class="dica" id="dica">toca no coração 💗</p>
</div>

<script>
  const LINHAS = [
    ["l1", "Amor, vc é a pessoa mais importante da minha vida."],
    ["l2", "Eu te quero na minha vida pra sempre."],
    ["l3", "Te amo dms, minha princesa ♡"]
  ];

  // estrelinhas de fundo
  for (let i = 0; i < 40; i++) {
    const s = document.createElement("div");
    s.className = "star";
    s.style.left = Math.random() * 100 + "vw";
    s.style.top = Math.random() * 100 + "vh";
    s.style.animationDelay = Math.random() * 3 + "s";
    document.body.appendChild(s);
  }

  const canvas = document.getElementById("heartCanvas");
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  let size, scale;

  function resize() {
    size = canvas.clientWidth;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    scale = size / 40;
  }
  resize();
  window.addEventListener("resize", resize);

  const pts = [];
  for (let t = 0; t <= Math.PI * 2; t += 0.015) {
    pts.push({
      x: 16 * Math.pow(Math.sin(t), 3),
      y: 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)
    });
  }

  function render(n, k) {
    ctx.clearRect(0, 0, size, size);
    const cx = size / 2, cy = size / 2;
    ctx.lineWidth = 1.2;
    ctx.shadowColor = "#ff4d94";
    ctx.shadowBlur = 10;
    for (let i = 0; i < n; i++) {
      const px = cx + pts[i].x * scale * k;
      const py = cy - (pts[i].y + 2.5) * scale * k;
      ctx.strokeStyle = `hsla(${325 + (i / pts.length) * 20}, 95%, 70%, .55)`;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(px, py);
      ctx.stroke();
    }
  }

  let n = 0, done = false, extra = 0;

  // nome dela formado por linhas que saem do centro do coração
  const NOME = "Alana";
  let nome = [], nomeIniciou = false, nomeFeito = false;

  function formarNome() {
    const W = 360, H = 140;
    const off = document.createElement("canvas");
    off.width = W; off.height = H;
    const o = off.getContext("2d");
    o.fillStyle = "#fff";
    o.font = "italic bold 110px Georgia, serif";
    o.textAlign = "center"; o.textBaseline = "middle";
    o.fillText(NOME, W / 2, H / 2);
    const data = o.getImageData(0, 0, W, H).data;
    for (let y = 0; y < H; y += 3) {
      for (let x = 0; x < W; x += 3) {
        if (data[(y * W + x) * 4 + 3] > 128) {
          nome.push({ x: (x - W / 2) / W, y: (y - H / 2) / W, d: Math.random() * 50, p: 0 });
        }
      }
    }
    nomeIniciou = true;
  }

  function desenharNome(k) {
    if (!nomeIniciou) return;
    const cx = size / 2, cy = size / 2, f = size * 0.75 * k;
    let tudoPronto = true;
    ctx.shadowColor = "#ff4d94";
    ctx.shadowBlur = 8;
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = "rgba(255,240,247,.9)";
    ctx.beginPath();
    const parados = [];
    for (const q of nome) {
      const tx = cx + q.x * f, ty = cy + q.y * f;
      if (q.d > 0) { q.d--; tudoPronto = false; continue; }
      if (q.p >= 1) { parados.push(tx, ty); continue; }
      q.p = Math.min(1, q.p + 0.025);
      tudoPronto = false;
      const e = 1 - Math.pow(1 - q.p, 3);
      const e0 = 1 - Math.pow(1 - Math.max(0, q.p - 0.12), 3);
      ctx.moveTo(cx + (tx - cx) * e0, cy + (ty - cy) * e0);
      ctx.lineTo(cx + (tx - cx) * e, cy + (ty - cy) * e);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#fff0f7";
    ctx.beginPath();
    for (let i = 0; i < parados.length; i += 2) ctx.rect(parados[i] - 1.3, parados[i + 1] - 1.3, 2.6, 2.6);
    ctx.fill();
    if (tudoPronto && !nomeFeito) { nomeFeito = true; setTimeout(revelar, 600); }
  }
  function animar(ts) {
    if (!done) {
      n = Math.min(n + 3, pts.length);
      render(n, 1);
      if (n >= pts.length) { done = true; formarNome(); }
    } else {
      extra *= 0.92; // pulinho quando toca
      const k = 1 + 0.035 * Math.sin(ts / 260) * Math.sin(ts / 520 + 1) + extra;
      if (estado === "rosa") {
        desenharRosa(ts);
      } else {
        let a = 1;
        if (estado === "morph") {
          if (t0 === null) t0 = ts;
          a = Math.max(0, 1 - (ts - t0) / 1000);
          if (a <= 0) { estado = "rosa"; tRosa = ts; }
        }
        ctx.globalAlpha = a;
        render(pts.length, k);
        desenharNome(k);
        ctx.globalAlpha = 1;
      }
    }
    requestAnimationFrame(animar);
  }
  requestAnimationFrame(animar);

  // ---------- ROSA (nasce quando ela toca no coração) ----------
  let estado = "coracao", t0 = null, tRosa = 0, textoPronto = false, l4Feito = false, rosa = null;
  const CORES = ["#0f5a1f", "#1b8a2f", "#2fbf47", "#8dffa3",            // 0-3 verdes
                 "#5a0715", "#8b0d22", "#b3122e", "#d81b3c", "#ff3a5c", "#ff8da3"]; // 4-9 vermelhos
  const HV = 0.7; // altura do centro da flor
  const stemX = v => 0.03 * Math.sin(v * 3.2);
  const lim = x => Math.min(1, Math.max(0, x));
  const suave = x => x * x * (3 - 2 * x);

  function iniciarRosa() {
    estado = "morph"; t0 = null;
    document.getElementById("dica").classList.remove("show");
  }

  function criarRosa() {
    const r = { caule: [], folhas: [], sepalas: [], flor: [], estrelas: [] };
    for (let i = 0; i < 320; i++) {
      const v = Math.random() * HV;
      r.caule.push({ x: stemX(v) + (Math.random() - .5) * 0.012, v, b: Math.random() < .3 ? 2 : (Math.random() < .5 ? 1 : 0) });
    }
    [[0.2, 1, 1.8], [0.36, -1, 2.4]].forEach(([v0, lado, tf]) => {
      const A = 0.55, dx = lado * Math.cos(A), dv = Math.sin(A);
      for (let i = 0; i < 230; i++) {
        const sx = Math.random(), q = Math.random() * 2 - 1, w = Math.sin(Math.PI * sx) * 0.05;
        r.folhas.push({
          bx: stemX(v0), bv: v0, h: v0, t0: tf,
          ox: dx * 0.19 * sx - dv * q * w,
          ov: dv * 0.19 * sx + dx * q * w - 0.05 * sx * sx,
          b: Math.abs(q) < 0.07 ? 3 : (Math.random() < .5 ? 1 : 2)
        });
      }
    });
    for (let i = 0; i < 140; i++) {
      const a = Math.PI * (1.15 + Math.random() * 0.7), rr = 0.115 * (0.6 + Math.random() * 0.4);
      r.sepalas.push({ x: Math.cos(a) * rr, y: Math.sin(a) * rr * 0.9 - 0.02, b: Math.random() < .5 ? 1 : 2 });
    }
    const R = 0.19;
    for (let i = 0; i < 1900; i++) {
      const espiral = i < 1100;
      let th, rho;
      if (espiral) { th = Math.random() * 7 * Math.PI; rho = th / (7 * Math.PI); }
      else { th = Math.random() * 2 * Math.PI; rho = Math.sqrt(Math.random()); }
      const rr = R * Math.pow(rho, 0.8) * (1 + 0.12 * Math.sin(5 * th + rho * 6)) + (Math.random() - .5) * 0.008;
      const b = 4 + Math.min(5, Math.floor(rho * 5 + (espiral ? 1.2 : 0) + Math.random()));
      r.flor.push({ x: rr * Math.cos(th), y: rr * Math.sin(th) * 0.9, b });
    }
    for (let i = 0; i < 28; i++) r.estrelas.push({ x: 0.08 + Math.random() * 0.84, y: Math.random() * 0.85, ph: Math.random() * 6.28 });
    return r;
  }

  function desenharRosa(ts) {
    if (!rosa) rosa = criarRosa();
    const t = (ts - tRosa) / 1000;
    const S = size, u = S / 300, cx = S / 2, base = S * 0.96, H = S * 0.92;
    const sway = Math.sin(ts / 1100) * 0.02 * lim((t - 3) / 2);
    const g = suave(lim(t / 2.4)) * HV;       // caule crescendo
    const sc = suave(lim((t - 2.8) / 1.0));   // botão aparecendo
    const o = suave(lim((t - 3.6) / 3.4));    // flor abrindo
    const X = (x, h) => cx + (x + sway * h * h) * S;
    const hx = X(stemX(HV), HV), hy = base - HV * H;
    const lotes = CORES.map(() => []);
    for (const p of rosa.caule) if (p.v <= g) lotes[p.b].push(X(p.x, p.v), base - p.v * H, 2.2 * u);
    for (const p of rosa.folhas) {
      const e = suave(lim((t - p.t0) / 1.5));
      if (e > 0) lotes[p.b].push(X(p.bx + p.ox * e, p.h), base - (p.bv + p.ov * e) * H, 1.8 * u);
    }
    if (sc > 0) {
      const ax = 0.5 + 0.5 * o, ay = 1.25 - 0.25 * o;
      for (const p of rosa.sepalas) lotes[p.b].push(hx + p.x * S * sc, hy - p.y * S * sc, 1.8 * u);
      for (const p of rosa.flor) lotes[p.b].push(hx + p.x * ax * S * sc, hy - p.y * ay * S * sc, 1.7 * u);
    }
    ctx.clearRect(0, 0, S, S);
    CORES.forEach((cor, i) => {
      const l = lotes[i];
      if (!l.length) return;
      ctx.shadowColor = cor; ctx.shadowBlur = 6; ctx.fillStyle = cor;
      ctx.beginPath();
      for (let j = 0; j < l.length; j += 3) ctx.rect(l[j] - l[j + 2] / 2, l[j + 1] - l[j + 2] / 2, l[j + 2], l[j + 2]);
      ctx.fill();
    });
    ctx.shadowBlur = 0;
    if (t > 1) { // brilhinhos
      ctx.lineWidth = 1;
      for (const e of rosa.estrelas) {
        const a = Math.sin(ts / 500 + e.ph);
        if (a < 0.3) continue;
        const ex = e.x * S, ey = e.y * S, m = (2 + a * 4) * u;
        ctx.strokeStyle = `rgba(255,225,235,${a})`;
        ctx.beginPath();
        ctx.moveTo(ex - m, ey); ctx.lineTo(ex + m, ey);
        ctx.moveTo(ex, ey - m); ctx.lineTo(ex, ey + m);
        ctx.stroke();
      }
    }
    if (t > 6.5 && !l4Feito) {
      l4Feito = true;
      digitar("l4", "Essa rosa é pra vc, q faz meu dia mais feliz ♡", () => {
        document.getElementById("l4").textContent += " 🌹";
      });
    }
  }

  // texto aparece digitando, linha por linha
  function digitar(id, texto, cb) {
    const el = document.getElementById(id);
    let i = 0;
    const t = setInterval(() => {
      el.textContent = texto.slice(0, ++i);
      if (i >= texto.length) { clearInterval(t); setTimeout(cb, 500); }
    }, 55);
  }

  function revelar() {
    document.getElementById("titulo").classList.add("show");
    setInterval(coracaoSobe, 700);
    let idx = 0;
    (function proxima() {
      if (idx >= LINHAS.length) {
        document.getElementById("dica").classList.add("show");
        textoPronto = true;
        return;
      }
      const [id, txt] = LINHAS[idx++];
      digitar(id, txt, proxima);
    })();
  }

  function coracaoSobe() {
    const s = document.createElement("span");
    s.className = "float";
    s.textContent = Math.random() > .5 ? "♥" : "♡";
    s.style.left = Math.random() * 95 + "vw";
    s.style.fontSize = (0.8 + Math.random() * 1.3) + "rem";
    s.style.animationDuration = (5 + Math.random() * 5) + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 11000);
  }

  // toque no coração: pulinho + explosão de corações
  canvas.addEventListener("pointerdown", (e) => {
    if (!done) return;
    if (estado === "coracao" && textoPronto) iniciarRosa();
    extra = 0.12;
    for (let i = 0; i < 14; i++) {
      const b = document.createElement("span");
      b.className = "burst";
      b.textContent = "♥";
      b.style.left = e.clientX + "px";
      b.style.top = e.clientY + "px";
      b.style.fontSize = (0.8 + Math.random()) + "rem";
      const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 90;
      b.style.setProperty("--dx", Math.cos(a) * d + "px");
      b.style.setProperty("--dy", Math.sin(a) * d + "px");
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 1300);
    }
  });
</script>
</body>
</html>
